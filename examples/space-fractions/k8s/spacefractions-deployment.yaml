apiVersion: apps/v1
kind: Deployment
metadata:
  name: spacefractions
  labels:
    app: spacefractions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spacefractions
  template:
    metadata:
      labels:
        app: spacefractions
    spec:
      containers:
        - name: spacefractions
          image: spacefractions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: spacefractions-db
                  key: url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spacefractions
  labels:
    app: spacefractions
spec:
  type: ClusterIP
  selector:
    app: spacefractions
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: spacefractions-db
type: Opaque
stringData:
  url: "postgres://postgres:postgres@postgres:5432/spacefractions"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score — Space Fractions</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>🏆 Scores</h1>
    <a class="back-link" href="/">← Menu</a>
  </header>

  <main class="score-screen">
    <h2>Recent Scores</h2>
    <table class="score-table">
      <thead>
        <tr>
          <th>Game</th>
          <th>Score</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="score-body">
        <tr><td colspan="4">Loading scores...</td></tr>
      </tbody>
    </table>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/score.js"></script>
</body>
</html>
